[project]
name = "promptforward-backend"
version = "0.1.0"
description = "PromptForward MVP backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "dropbox>=12.0.2",
    "tiktoken>=0.7.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency declarations are function calls in argument defaults by design.
"app/routes/*.py" = ["B008"]
